<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>خانه — بیمار</title>
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
<style>
body { padding-bottom: 72px; max-width: 480px; margin: 0 auto; }
.topbar { background: var(--teal); padding: 20px 16px 24px; color: #fff; }
.topbar h2 { font-size: 18px; font-weight: 500; }
.topbar p  { font-size: 12px; opacity: .8; margin-top: 2px; }
.top-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.av { width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:500; }
.next-card { background:rgba(255,255,255,.15); border-radius:12px; padding:14px; margin-top:4px; }
.next-card .date { font-size:13px; opacity:.85; margin-bottom:4px; }
.next-card .time { font-size:22px; font-weight:500; }
.next-card .spec { font-size:12px; opacity:.85; }
.next-card .chip { display:inline-block; background:rgba(255,255,255,.2); border-radius:20px; padding:3px 10px; font-size:11px; margin-top:8px; }
.content { padding:16px; display:flex; flex-direction:column; gap:12px; }
.quick-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.q-btn { background:#fff; border:0.5px solid var(--g1); border-radius:12px; padding:14px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; text-decoration:none; }
.q-btn .ic { width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px; }
.q-btn span { font-size:12px; color:var(--g6); }
.list-row { display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--g0); }
.list-row:last-child { border-bottom:none; }
.li-ic { width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0; }
.li-info { flex:1; }
.li-info .t { font-size:13px; font-weight:500; }
.li-info .s { font-size:11px; color:var(--g5); margin-top:1px; }
.tabbar { position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:0.5px solid var(--g1);display:flex;max-width:480px;margin:0 auto;padding:8px 0 12px; }
.tab { flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--g5);text-decoration:none;opacity:.55; }
.tab.active { opacity:1;color:var(--teal); }
.tab i { font-size:20px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="top-row">
    <div>
      <p>سلام</p>
      <h2 id="userName">در حال بارگذاری...</h2>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <i class="ti ti-bell" style="font-size:22px;color:#fff"></i>
      <div class="av" id="userAv">؟</div>
    </div>
  </div>
  <div class="next-card" id="nextAppt">
    <div class="date">در حال بارگذاری...</div>
  </div>
</div>

<div class="content">
  <div class="quick-grid">
    <a class="q-btn" href="appointments.html">
      <div class="ic" style="background:var(--teal-l);color:var(--teal)"><i class="ti ti-calendar-plus"></i></div>
      <span>نوبت جدید</span>
    </a>
    <a class="q-btn" href="prescriptions.html">
      <div class="ic" style="background:var(--amber-l);color:var(--amber)"><i class="ti ti-file-text"></i></div>
      <span>نسخه‌ها</span>
    </a>
    <a class="q-btn" href="history.html">
      <div class="ic" style="background:var(--coral-l);color:var(--coral)"><i class="ti ti-history"></i></div>
      <span>سابقه مراجعات</span>
    </a>
    <a class="q-btn" href="messages.html">
      <div class="ic" style="background:var(--purple-l);color:var(--purple)"><i class="ti ti-message-circle"></i></div>
      <span>پیام‌های دکتر</span>
    </a>
  </div>

  <div class="card">
    <div class="sec-header">
      <span class="sec-title">نوبت‌های اخیر</span>
      <a href="history.html" style="font-size:12px;color:var(--teal);text-decoration:none">همه</a>
    </div>
    <div id="recentList"><div class="empty-state"><i class="ti ti-loader" style="font-size:24px"></i><p>در حال بارگذاری...</p></div></div>
  </div>
</div>

<div class="tabbar">
  <a class="tab active" href="home.html"><i class="ti ti-home"></i>خانه</a>
  <a class="tab" href="appointments.html"><i class="ti ti-calendar"></i>نوبت‌ها</a>
  <a class="tab" href="prescriptions.html"><i class="ti ti-file-text"></i>نسخه</a>
  <a class="tab" href="profile.html"><i class="ti ti-user"></i>پروفایل</a>
</div>

<div id="toast"></div>

<script type="module">
import { api, getUser } from '../shared/api.js';
import { requireAuth } from '../shared/auth.js';
import { toast, formatDate, formatTime, statusBadge, empty } from '../shared/ui.js';

if (!requireAuth(['User','Admin','Doctor'])) throw new Error('auth');

const user = getUser();
document.getElementById('userName').textContent = `${user.firstName} ${user.lastName}`;
document.getElementById('userAv').textContent = user.firstName?.[0] ?? '؟';

async function loadNext() {
  try {
    const list = await api('GET', '/api/reservations/my');
    const upcoming = list?.filter(r => new Date(r.reservationDate) >= new Date() && r.status !== 'Cancelled');
    const el = document.getElementById('nextAppt');
    if (!upcoming?.length) {
      el.innerHTML = '<div class="date">نوبتی ندارید</div><div class="time" style="font-size:14px;margin-top:4px">برای رزرو نوبت کلیک کنید</div>';
      return;
    }
    const n = upcoming[0];
    el.innerHTML = `
      <div class="date">${formatDate(n.reservationDate)}</div>
      <div class="time">${formatTime(n.startTime)}</div>
      <div class="spec">${n.specialtyName ?? ''}</div>
      <span class="chip"><i class="ti ti-clock"></i> نوبت بعدی</span>`;
  } catch(e) { console.error(e); }
}

async function loadRecent() {
  try {
    const list = await api('GET', '/api/reservations/my');
    const el = document.getElementById('recentList');
    if (!list?.length) { el.innerHTML = empty('نوبتی ثبت نشده'); return; }
    const recent = list.slice(0, 4);
    el.innerHTML = recent.map(r => `
      <div class="list-row">
        <div class="li-ic" style="background:var(--teal-l);color:var(--teal)"><i class="ti ti-tooth"></i></div>
        <div class="li-info">
          <div class="t">${r.specialtyName ?? 'تخصص'}</div>
          <div class="s">${formatDate(r.reservationDate)} — ${formatTime(r.startTime)}</div>
        </div>
        ${statusBadge(r.status)}
      </div>`).join('');
  } catch(e) { console.error(e); }
}

loadNext();
loadRecent();
</script>
</body>
</html>
