name: CD — Build & Push Docker Image

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "Docs/**"

env:
  DOTNET_VERSION: "8.0.x"
  IMAGE_NAME:     ahmad-onlineshop-api

jobs:
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Cache NuGet ─────────────────────────────────────────────────────────
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # ── Setup .NET ──────────────────────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── Quick build check ───────────────────────────────────────────────────
      - name: Add local NuGet feed
        run: |
          if [ -d "Nuget" ]; then
            dotnet nuget add source "$GITHUB_WORKSPACE/Nuget" --name LocalFeed || true
          fi

      - name: Restore & Build
        run: |
          dotnet restore Ahmad.OnlineShop.sln
          dotnet build Ahmad.OnlineShop.sln --no-restore -c Release

      # ── Docker meta ─────────────────────────────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},event=tag

      # ── Login to Docker Hub ─────────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ── Build & Push ────────────────────────────────────────────────────────
      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context:    .
          dockerfile: Dockerfile
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
