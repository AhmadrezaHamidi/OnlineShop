<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت دکترها</title>
<link rel="stylesheet" href="../../shared/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
<style>
:root{--sidebar:220px}
body{display:flex;min-height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar);background:var(--teal-d);display:flex;flex-direction:column;flex-shrink:0;height:100vh;position:sticky;top:0}
.logo{padding:20px 16px;border-bottom:0.5px solid rgba(255,255,255,.1)}
.logo-row{display:flex;align-items:center;gap:10px}
.logo-ic{width:34px;height:34px;background:var(--teal-m);border-radius:10px;display:flex;align-items:center;justify-content:center}
.logo-t{font-size:15px;font-weight:500;color:#fff}
.nav-sec{padding:14px 10px 4px}
.nav-lbl{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.8px;text-transform:uppercase;padding:0 6px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:rgba(255,255,255,.65);font-size:13px;cursor:pointer;margin-bottom:2px;text-decoration:none}
.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.13);color:#fff}
.nav-item i{font-size:17px}
.sb-user{margin-top:auto;padding:14px;border-top:0.5px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:8px}
.sb-av{width:32px;height:32px;border-radius:50%;background:var(--teal-m);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:500}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;height:100vh}
.topbar{background:#fff;border-bottom:0.5px solid var(--g1);padding:0 24px;height:54px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:20px 24px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--g0);border:0.5px solid var(--g1);border-radius:8px;padding:7px 12px}
.search input{background:none;border:none;outline:none;font-size:12px;color:var(--g7);width:180px;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.doc-card{background:#fff;border-radius:12px;border:0.5px solid var(--g1);overflow:hidden}
.doc-card-top{background:var(--teal-l);padding:20px;text-align:center}
.doc-av{width:56px;height:56px;border-radius:50%;background:var(--teal);display:inline-flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:500;margin-bottom:8px}
.doc-card-body{padding:14px}
.doc-info{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--g5);margin-bottom:4px}
.doc-info i{font-size:14px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--g0);border-top:0.5px solid var(--g1)}
/* Toggle switch */
.switch{position:relative;width:40px;height:22px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--g2);border-radius:12px;transition:.2s}
.slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--teal)}
.switch input:checked+.slider:before{transform:translateX(18px)}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:16px;font-weight:500}
.close-btn{width:32px;height:32px;border:none;background:var(--g0);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--g5)}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <div class="logo-row">
      <div class="logo-ic"><i class="ti ti-tooth" style="font-size:18px;color:#fff"></i></div>
      <div>
        <div class="logo-t">کلینیک دندان</div>
        <div style="font-size:10px;color:rgba(255,255,255,.45);margin-top:2px">پنل مدیریت</div>
      </div>
    </div>
  </div>
  <div class="nav-sec">
    <div class="nav-lbl">اصلی</div>
    <a class="nav-item" href="../dashboard.html"><i class="ti ti-layout-dashboard"></i>داشبورد</a>
    <a class="nav-item" href="appointments.html"><i class="ti ti-calendar"></i>نوبت‌ها</a>
    <a class="nav-item" href="patients.html"><i class="ti ti-users"></i>بیماران</a>
    <a class="nav-item active" href="doctors.html"><i class="ti ti-stethoscope"></i>دکترها</a>
  </div>
  <div class="nav-sec">
    <div class="nav-lbl">ابزارها</div>
    <a class="nav-item" href="sms.html"><i class="ti ti-message-dots"></i>کمپین SMS</a>
    <a class="nav-item" href="settings.html"><i class="ti ti-settings"></i>تنظیمات</a>
  </div>
  <div class="sb-user">
    <div class="sb-av" id="sbAv">ا</div>
    <div style="flex:1"><div style="font-size:12px;color:#fff;font-weight:500" id="sbName">ادمین</div></div>
    <i class="ti ti-logout" style="color:rgba(255,255,255,.4);cursor:pointer" onclick="doLogout()"></i>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div style="font-size:15px;font-weight:500;color:var(--g7);flex:1">دکترها</div>
    <button class="btn btn-primary" onclick="openAddModal()" style="font-size:12px;padding:7px 14px">
      <i class="ti ti-plus"></i> افزودن دکتر
    </button>
  </div>

  <div class="content">
    <div class="toolbar">
      <div class="search">
        <i class="ti ti-search" style="color:var(--g2);font-size:15px"></i>
        <input type="text" placeholder="جستجو نام یا تخصص..." id="searchInput" oninput="applyFilter()">
      </div>
      <select style="border:0.5px solid var(--g1);border-radius:8px;padding:7px 10px;font-size:12px;background:#fff;font-family:inherit" id="activeFilter" onchange="applyFilter()">
        <option value="">همه</option>
        <option value="true">فعال</option>
        <option value="false">غیرفعال</option>
      </select>
    </div>

    <div class="grid" id="grid">
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--g5)">
        <i class="ti ti-loader" style="font-size:24px"></i><br>در حال بارگذاری...
      </div>
    </div>
  </div>
</div>

<!-- مودال افزودن دکتر -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-title">افزودن دکتر جدید</span>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>

    <div class="form-group">
      <label>شماره موبایل</label>
      <input type="tel" class="input" id="mPhone" placeholder="09xxxxxxxxx" dir="ltr" maxlength="11">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group">
        <label>نام</label>
        <input type="text" class="input" id="mFName" placeholder="نام">
      </div>
      <div class="form-group">
        <label>نام خانوادگی</label>
        <input type="text" class="input" id="mLName" placeholder="نام خانوادگی">
      </div>
    </div>
    <div class="form-group">
      <label>تخصص</label>
      <select class="input" id="mSpec">
        <option value="">انتخاب تخصص...</option>
        <option value="1">دندانپزشکی عمومی</option>
        <option value="2">ایمپلنت و جراحی</option>
        <option value="3">ارتودنسی</option>
        <option value="4">اطفال</option>
        <option value="5">پریودنتولوژی</option>
      </select>
    </div>
    <div class="form-group">
      <label>شماره نظام پزشکی</label>
      <input type="text" class="input" id="mLicense" placeholder="IR-XXXXX" dir="ltr">
    </div>
    <div class="form-group">
      <label>بیوگرافی (اختیاری)</label>
      <textarea class="input" id="mBio" rows="3" placeholder="توضیحات..."></textarea>
    </div>

    <button class="btn btn-primary btn-full" id="addBtn" onclick="addDoctor()">ثبت دکتر</button>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { api, getUser } from '../../shared/api.js';
import { requireAuth } from '../../shared/auth.js';
import { toast, setLoading, empty } from '../../shared/ui.js';

if (!requireAuth(['Admin'])) throw new Error('auth');

const user = getUser();
document.getElementById('sbName').textContent = `${user.firstName} ${user.lastName}`;
document.getElementById('sbAv').textContent   = user.firstName?.[0] ?? 'ا';

let all = [], filtered = [];

async function load() {
  try {
    all = await api('GET', '/api/admin/doctors') ?? [];
    applyFilter();
  } catch(e) {
    document.getElementById('grid').innerHTML =
      '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--coral)">خطا در بارگذاری</div>';
  }
}

window.applyFilter = () => {
  const q  = document.getElementById('searchInput').value.toLowerCase();
  const ac = document.getElementById('activeFilter').value;
  filtered = all.filter(d =>
    (!q || `${d.firstName} ${d.lastName} ${d.specialtyTitle}`.toLowerCase().includes(q)) &&
    (!ac || String(d.isActive) === ac)
  );
  render();
};

function render() {
  const grid = document.getElementById('grid');
  if (!filtered.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--g5)">دکتری یافت نشد</div>';
    return;
  }
  grid.innerHTML = filtered.map(d => `
    <div class="doc-card">
      <div class="doc-card-top">
        <div class="doc-av">${d.firstName?.[0] ?? 'د'}</div>
        <div style="font-size:15px;font-weight:500">دکتر ${d.firstName} ${d.lastName}</div>
        <div style="font-size:12px;color:var(--teal);margin-top:4px">${d.specialtyTitle ?? '—'}</div>
      </div>
      <div class="doc-card-body">
        <div class="doc-info"><i class="ti ti-id-badge"></i>${d.medicalLicenseNumber ?? '—'}</div>
        <div class="doc-info"><i class="ti ti-phone"></i><span dir="ltr">${d.phoneNumber}</span></div>
        <div class="doc-info"><i class="ti ti-calendar"></i>امروز: ${d.todayCount ?? 0} نوبت</div>
      </div>
      <div class="toggle-row">
        <span style="font-size:12px;color:var(--g6)">${d.isActive ? 'فعال' : 'غیرفعال'}</span>
        <label class="switch">
          <input type="checkbox" ${d.isActive ? 'checked' : ''} onchange="toggleActive(${d.id}, this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>`).join('');
}

window.toggleActive = async (id, active) => {
  try {
    await api('PATCH', `/api/admin/doctors/${id}/toggle-active`);
    const d = all.find(x => x.id === id);
    if (d) d.isActive = active;
    toast(active ? 'دکتر فعال شد' : 'دکتر غیرفعال شد', 'success');
  } catch(e) {
    toast('خطا در تغییر وضعیت', 'error');
    load();
  }
};

window.openAddModal = () => {
  document.getElementById('overlay').classList.add('show');
};
window.closeModal = () => {
  document.getElementById('overlay').classList.remove('show');
};

window.addDoctor = async () => {
  const btn = document.getElementById('addBtn');
  const body = {
    phoneNumber: document.getElementById('mPhone').value.trim(),
    firstName:   document.getElementById('mFName').value.trim(),
    lastName:    document.getElementById('mLName').value.trim(),
    specialtyId: parseInt(document.getElementById('mSpec').value),
    medicalLicenseNumber: document.getElementById('mLicense').value.trim(),
    bio: document.getElementById('mBio').value.trim(),
  };
  if (!body.phoneNumber || !body.firstName || !body.lastName || !body.specialtyId) {
    toast('فیلدهای اجباری را پر کنید', 'error'); return;
  }
  setLoading(btn, true);
  try {
    await api('POST', '/api/admin/doctors', body);
    toast('دکتر با موفقیت اضافه شد', 'success');
    closeModal();
    load();
  } catch(e) {
    toast(e?.message ?? 'خطا', 'error');
  } finally { setLoading(btn, false); }
};

window.doLogout = () => { if(confirm('خروج؟')){ localStorage.clear(); window.location.href='../index.html'; } };

load();
</script>
</body>
</html>
