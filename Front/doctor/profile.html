<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>پروفایل دکتر</title>
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
<style>
body { padding-bottom:72px; max-width:480px; margin:0 auto; }
.topbar { background:var(--teal-d); padding:16px; display:flex; align-items:center; gap:12px; color:#fff; }
.topbar h2 { font-size:16px; font-weight:500; }
.content { padding:16px; display:flex; flex-direction:column; gap:12px; }
.profile-av { width:80px;height:80px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;font-weight:500;margin:0 auto 12px; }
.info-row { display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--g0); }
.info-row:last-child { border-bottom:none; }
.info-row i { font-size:18px;color:var(--g2);width:22px; }
.info-row .label { font-size:12px;color:var(--g5);flex:1; }
.info-row .val { font-size:13px;color:var(--g7);font-weight:500; }
.menu-item { display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:10px;border:0.5px solid var(--g1);text-decoration:none;color:var(--g7); }
.menu-item i { font-size:20px;color:var(--g5); }
.menu-item span { flex:1;font-size:14px; }
.tabbar { position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:0.5px solid var(--g1);display:flex;max-width:480px;margin:0 auto;padding:8px 0 12px; }
.tab { flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--g5);text-decoration:none;opacity:.55; }
.tab.active { opacity:1;color:var(--teal); }
.tab i { font-size:20px; }
</style>
</head>
<body>

<div class="topbar">
  <a href="home.html" style="color:#fff;text-decoration:none"><i class="ti ti-arrow-right" style="font-size:20px"></i></a>
  <h2>پروفایل</h2>
</div>

<div class="content">
  <div class="card" style="text-align:center;padding:24px 16px">
    <div class="profile-av" id="docAv">د</div>
    <div style="font-size:18px;font-weight:500" id="docName">در حال بارگذاری...</div>
    <div style="font-size:13px;color:var(--teal);margin-top:4px" id="docSpec"></div>
  </div>

  <div class="card">
    <div class="info-row">
      <i class="ti ti-id-badge"></i>
      <span class="label">شماره نظام پزشکی</span>
      <span class="val" id="licenseNo">—</span>
    </div>
    <div class="info-row">
      <i class="ti ti-phone"></i>
      <span class="label">شماره موبایل</span>
      <span class="val" id="docPhone">—</span>
    </div>
    <div class="info-row">
      <i class="ti ti-notes"></i>
      <span class="label">بیوگرافی</span>
      <span class="val" id="docBio" style="font-size:12px;text-align:left">—</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <a class="menu-item" href="schedule.html">
      <i class="ti ti-calendar-week"></i>
      <span>برنامه هفتگی</span>
      <i class="ti ti-chevron-left" style="color:var(--g2)"></i>
    </a>
    <a class="menu-item" href="#" onclick="doLogout()">
      <i class="ti ti-logout" style="color:var(--coral)"></i>
      <span style="color:var(--coral)">خروج</span>
      <i class="ti ti-chevron-left" style="color:var(--g2)"></i>
    </a>
  </div>
</div>

<div class="tabbar">
  <a class="tab" href="home.html"><i class="ti ti-layout-dashboard"></i>داشبورد</a>
  <a class="tab" href="schedule.html"><i class="ti ti-calendar"></i>نوبت‌ها</a>
  <a class="tab" href="prescriptions.html"><i class="ti ti-file-text"></i>نسخه</a>
  <a class="tab active" href="profile.html"><i class="ti ti-user"></i>پروفایل</a>
</div>

<div id="toast"></div>

<script type="module">
import { api, getUser, logout } from '../shared/api.js';
import { requireAuth } from '../shared/auth.js';

if (!requireAuth(['Doctor'])) throw new Error('auth');

const user = getUser();
document.getElementById('docAv').textContent   = user.firstName?.[0] ?? 'د';

async function load() {
  try {
    const p = await api('GET', '/api/doctor/profile');
    document.getElementById('docName').textContent    = `دکتر ${p.user.firstName} ${p.user.lastName}`;
    document.getElementById('docSpec').textContent    = p.specialtyTitle;
    document.getElementById('docPhone').textContent   = p.user.phoneNumber;
    document.getElementById('licenseNo').textContent  = p.medicalLicenseNumber ?? '—';
    document.getElementById('docBio').textContent     = p.bio ?? '—';
  } catch(e) {
    document.getElementById('docName').textContent = `${user.firstName} ${user.lastName}`;
  }
}

window.doLogout = () => {
  if (confirm('از حساب خارج می‌شوید؟')) { logout(); window.location.href = '../patient/index.html'; }
};

load();
</script>
</body>
</html>
