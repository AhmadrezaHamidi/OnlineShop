apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '10s'

  - name: Seq
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://seq:5341
    editable: true
    jsonData:
      allowedHosts:
        - http://seq:5341
