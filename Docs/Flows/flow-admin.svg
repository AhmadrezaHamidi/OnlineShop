<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma,Arial,sans-serif">
  <title>Admin Flow — OnlineShop</title>
  <rect width="820" height="400" fill="#f8fafc" rx="12"/>
  <text x="410" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#7c3aed">🔑 فرایند ادمین (Admin Flow)</text>

  <rect x="20" y="65" width="150" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="95" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">1. مدیریت کاربران</text>
  <text x="95" y="106" text-anchor="middle" font-size="9" fill="#7c3aed">GET /Identity/Users</text>
  <text x="95" y="120" text-anchor="middle" font-size="9" fill="#7c3aed">POST .../Activate/Suspend</text>
  <text x="95" y="134" text-anchor="middle" font-size="9" fill="#6b7280">PUT .../Profile</text>

  <rect x="185" y="65" width="150" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="260" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">2. نقش‌دهی</text>
  <text x="260" y="106" text-anchor="middle" font-size="9" fill="#7c3aed">GET /Identity/Roles</text>
  <text x="260" y="120" text-anchor="middle" font-size="9" fill="#7c3aed">POST .../Roles/{roleId}</text>
  <text x="260" y="134" text-anchor="middle" font-size="9" fill="#6b7280">DELETE .../Roles/{roleId}</text>

  <rect x="350" y="65" width="150" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="425" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">3. تیم ادمین</text>
  <text x="425" y="106" text-anchor="middle" font-size="9" fill="#7c3aed">POST /BackOffice/Admins</text>
  <text x="425" y="120" text-anchor="middle" font-size="9" fill="#7c3aed">PATCH .../Role</text>
  <text x="425" y="134" text-anchor="middle" font-size="9" fill="#6b7280">GET .../AuditLogs</text>

  <rect x="515" y="65" width="150" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="590" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">4. تخفیف‌ها</text>
  <text x="590" y="106" text-anchor="middle" font-size="9" fill="#7c3aed">POST /Discounts</text>
  <text x="590" y="120" text-anchor="middle" font-size="9" fill="#7c3aed">PUT .../activate</text>
  <text x="590" y="134" text-anchor="middle" font-size="9" fill="#6b7280">PUT .../deactivate</text>

  <rect x="680" y="65" width="120" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="740" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">5. گزارش‌ها</text>
  <text x="740" y="106" text-anchor="middle" font-size="9" fill="#7c3aed">POST /BackOffice/Reports</text>
  <text x="740" y="120" text-anchor="middle" font-size="9" fill="#7c3aed">PATCH .../Complete</text>
  <text x="740" y="134" text-anchor="middle" font-size="9" fill="#6b7280">PATCH .../Fail</text>

  <line x1="170" y1="105" x2="183" y2="105" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="335" y1="105" x2="348" y2="105" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="500" y1="105" x2="513" y2="105" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="665" y1="105" x2="678" y2="105" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ap)"/>

  <!-- Row 2 -->
  <rect x="100" y="230" width="280" height="75" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="240" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#4c1d95">6. مدیریت اعتبار BNPL</text>
  <text x="240" y="270" text-anchor="middle" font-size="9" fill="#6d28d9">PUT /bnpl/users/{userId}/credit/increase</text>
  <text x="240" y="285" text-anchor="middle" font-size="9" fill="#6d28d9">PATCH .../credit/block  |  PATCH .../credit/release</text>
  <text x="240" y="298" text-anchor="middle" font-size="9" fill="#6b7280">GET /bnpl/users/{userId}/credit</text>

  <rect x="430" y="230" width="280" height="75" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="570" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#4c1d95">7. بازاریابی پیامکی</text>
  <text x="570" y="272" text-anchor="middle" font-size="9" fill="#6d28d9">POST /Marketing/sms/broadcast</text>
  <text x="570" y="288" text-anchor="middle" font-size="9" fill="#6b7280">ارسال پیامک انبوه به همه مشتریان</text>

  <line x1="95" y1="145" x2="95" y2="195" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="95" y1="195" x2="240" y2="195" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="240" y1="195" x2="240" y2="228" stroke="#c4b5fd" stroke-width="1.5" marker-end="url(#ap2)"/>

  <line x1="740" y1="145" x2="740" y2="195" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="740" y1="195" x2="570" y2="195" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="570" y1="195" x2="570" y2="228" stroke="#c4b5fd" stroke-width="1.5" marker-end="url(#ap2)"/>

  <!-- note -->
  <rect x="20" y="340" width="780" height="40" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="410" y="365" text-anchor="middle" font-size="10" fill="#6d28d9">همه عملیات BackOffice نیاز به احراز هویت و نقش Admin دارند — GET /BackOffice/Admins/{id}/AuditLogs برای حسابرسی کامل</text>

  <defs>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/></marker>
    <marker id="ap2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c4b5fd"/></marker>
  </defs>
</svg>
