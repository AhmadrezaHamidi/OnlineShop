<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>داشبورد دکتر</title>
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
<style>
body { padding-bottom:72px; max-width:480px; margin:0 auto; }
.topbar { background:var(--teal-d); padding:18px 16px 22px; color:#fff; }
.top-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.av { width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:500; }
.stats-row { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.stat { background:rgba(255,255,255,.12); border-radius:10px; padding:12px; text-align:center; }
.stat .n { font-size:24px; font-weight:500; }
.stat .l { font-size:11px; opacity:.75; margin-top:2px; }
.content { padding:16px; display:flex; flex-direction:column; gap:12px; }
.slot-item { display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:0.5px solid var(--g1);background:#fff;margin-bottom:6px; }
.slot-item.done  { background:var(--g0); opacity:.75; }
.slot-item.next  { border-color:var(--teal); background:#fff; }
.slot-time { font-size:13px;font-weight:500;min-width:44px;color:var(--g7); }
.slot-info { flex:1; }
.slot-info .t { font-size:13px;font-weight:500; }
.slot-info .s { font-size:11px;color:var(--g5); }
.quick-grid { display:grid;grid-template-columns:repeat(2,1fr);gap:8px; }
.q-btn { background:#fff;border:0.5px solid var(--g1);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-decoration:none; }
.q-btn .ic { width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px; }
.q-btn span { font-size:12px;color:var(--g6); }
.tabbar { position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:0.5px solid var(--g1);display:flex;max-width:480px;margin:0 auto;padding:8px 0 12px; }
.tab { flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--g5);text-decoration:none;opacity:.55; }
.tab.active { opacity:1;color:var(--teal); }
.tab i { font-size:20px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="top-row">
    <div>
      <div style="font-size:11px;opacity:.7" id="todayDate"></div>
      <div style="font-size:17px;font-weight:500;margin-top:2px" id="docName">دکتر ...</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <i class="ti ti-bell" style="font-size:22px;color:rgba(255,255,255,.8)"></i>
      <div class="av" id="docAv">د</div>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat"><div class="n" id="statToday">—</div><div class="l">نوبت امروز</div></div>
    <div class="stat"><div class="n" id="statRx">—</div><div class="l">نسخه این هفته</div></div>
  </div>
</div>

<div class="content">
  <div class="quick-grid">
    <a class="q-btn" href="schedule.html">
      <div class="ic" style="background:var(--teal-l);color:var(--teal)"><i class="ti ti-calendar-week"></i></div>
      <span>برنامه هفتگی</span>
    </a>
    <a class="q-btn" href="prescriptions.html">
      <div class="ic" style="background:var(--amber-l);color:var(--amber)"><i class="ti ti-file-plus"></i></div>
      <span>ثبت نسخه</span>
    </a>
    <a class="q-btn" href="patients.html">
      <div class="ic" style="background:var(--coral-l);color:var(--coral)"><i class="ti ti-users"></i></div>
      <span>بیماران امروز</span>
    </a>
    <a class="q-btn" href="message.html">
      <div class="ic" style="background:var(--purple-l);color:var(--purple)"><i class="ti ti-message-circle"></i></div>
      <span>پیام به بیمار</span>
    </a>
  </div>

  <div class="card">
    <div class="sec-header">
      <span class="sec-title">برنامه امروز</span>
      <a href="schedule.html" style="font-size:12px;color:var(--teal);text-decoration:none">همه</a>
    </div>
    <div id="todayList"><div class="empty-state"><i class="ti ti-loader"></i><p>در حال بارگذاری...</p></div></div>
  </div>
</div>

<div class="tabbar">
  <a class="tab active" href="home.html"><i class="ti ti-layout-dashboard"></i>داشبورد</a>
  <a class="tab" href="schedule.html"><i class="ti ti-calendar"></i>نوبت‌ها</a>
  <a class="tab" href="prescriptions.html"><i class="ti ti-file-text"></i>نسخه</a>
  <a class="tab" href="profile.html"><i class="ti ti-user"></i>پروفایل</a>
</div>

<div id="toast"></div>

<script type="module">
import { api, getUser } from '../shared/api.js';
import { requireAuth } from '../shared/auth.js';
import { toast, formatTime, statusBadge, empty } from '../shared/ui.js';

if (!requireAuth(['Doctor'])) throw new Error('auth');

const user = getUser();
document.getElementById('docName').textContent = `دکتر ${user.firstName} ${user.lastName}`;
document.getElementById('docAv').textContent   = user.firstName?.[0] ?? 'د';
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('fa-IR', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

async function load() {
  try {
    const data = await api('GET', '/api/doctor/today');
    document.getElementById('statToday').textContent = data.total ?? 0;

    const el = document.getElementById('todayList');
    if (!data.items?.length) { el.innerHTML = empty('نوبتی برای امروز نیست'); return; }

    const now = new Date();
    const nowTime = now.getHours() * 60 + now.getMinutes();

    el.innerHTML = data.items.map(r => {
      const [h, m] = r.startTime.split(':').map(Number);
      const slotMin = h * 60 + m;
      const isDone  = slotMin < nowTime && r.status === 'Confirmed';
      const isNext  = slotMin >= nowTime;
      return `
      <div class="slot-item ${isDone ? 'done' : isNext ? 'next' : ''}">
        <span class="slot-time">${formatTime(r.startTime)}</span>
        <div class="slot-info">
          <div class="t">${r.patientName}</div>
          <div class="s">${r.specialty}</div>
        </div>
        ${statusBadge(r.status)}
      </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('todayList').innerHTML = empty('خطا در بارگذاری');
  }

  // تعداد نسخه‌های هفتگی
  try {
    const sched = await api('GET', '/api/doctor/schedule');
    let rxCount = 0;
    sched?.forEach(day => day.items?.forEach(() => rxCount++));
    document.getElementById('statRx').textContent = rxCount;
  } catch(e) {}
}

load();
</script>
</body>
</html>
