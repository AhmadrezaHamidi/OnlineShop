<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma,Arial,sans-serif">
  <title>System Flow — OnlineShop</title>
  <rect width="820" height="380" fill="#f8fafc" rx="12"/>
  <text x="410" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#b45309">⚙️ فرایند سیستمی (System / State Machine)</text>

  <!-- Order state machine -->
  <text x="30" y="75" font-size="12" font-weight="bold" fill="#78350f">چرخه سفارش (Order State Machine)</text>

  <rect x="30" y="88" width="110" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="85" y="109" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Place</text>
  <text x="85" y="125" text-anchor="middle" font-size="9" fill="#6b7280">POST .../Place</text>

  <rect x="180" y="88" width="110" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="235" y="109" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Confirm</text>
  <text x="235" y="125" text-anchor="middle" font-size="9" fill="#6b7280">POST .../Confirm</text>

  <rect x="330" y="88" width="110" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="385" y="109" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Ship</text>
  <text x="385" y="125" text-anchor="middle" font-size="9" fill="#6b7280">POST .../Ship</text>

  <rect x="480" y="88" width="110" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="535" y="109" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Deliver ✓</text>
  <text x="535" y="125" text-anchor="middle" font-size="9" fill="#6b7280">POST .../Deliver</text>

  <rect x="630" y="88" width="110" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="685" y="109" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">Cancel ✗</text>
  <text x="685" y="125" text-anchor="middle" font-size="9" fill="#6b7280">POST .../Cancel</text>

  <line x1="140" y1="113" x2="178" y2="113" stroke="#ca8a04" stroke-width="2" marker-end="url(#as)"/>
  <line x1="290" y1="113" x2="328" y2="113" stroke="#ca8a04" stroke-width="2" marker-end="url(#as)"/>
  <line x1="440" y1="113" x2="478" y2="113" stroke="#ca8a04" stroke-width="2" marker-end="url(#as)"/>
  <line x1="330" y1="95" x2="630" y2="95" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ac)"/>
  <text x="480" y="88" text-anchor="middle" font-size="9" fill="#dc2626">لغو (هر مرحله)</text>

  <!-- Payment flow -->
  <text x="30" y="185" font-size="12" font-weight="bold" fill="#78350f">چرخه پرداخت (Payment Flow)</text>

  <rect x="30" y="198" width="160" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="110" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">ثبت پرداخت</text>
  <text x="110" y="235" text-anchor="middle" font-size="9" fill="#6b7280">POST /Order/{id}/Payments</text>

  <rect x="240" y="198" width="160" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">تایید پرداخت ✓</text>
  <text x="320" y="235" text-anchor="middle" font-size="9" fill="#6b7280">PATCH .../Complete</text>

  <rect x="450" y="198" width="160" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="530" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">شکست پرداخت ✗</text>
  <text x="530" y="235" text-anchor="middle" font-size="9" fill="#6b7280">PATCH .../Fail</text>

  <line x1="190" y1="223" x2="238" y2="223" stroke="#f59e0b" stroke-width="2" marker-end="url(#ay)"/>
  <line x1="190" y1="228" x2="448" y2="228" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ac)"/>

  <!-- Inventory flow -->
  <text x="30" y="290" font-size="12" font-weight="bold" fill="#78350f">چرخه موجودی (Inventory Flow)</text>

  <rect x="30" y="303" width="140" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="100" y="323" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Replenish</text>
  <text x="100" y="339" text-anchor="middle" font-size="9" fill="#6b7280">فروشنده موجودی افزود</text>

  <rect x="210" y="303" width="140" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="280" y="323" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Reserve</text>
  <text x="280" y="339" text-anchor="middle" font-size="9" fill="#6b7280">هنگام ثبت سفارش</text>

  <rect x="390" y="303" width="140" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="323" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Confirm ✓</text>
  <text x="460" y="339" text-anchor="middle" font-size="9" fill="#6b7280">پس از تحویل</text>

  <rect x="570" y="303" width="140" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="640" y="323" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">Release ✗</text>
  <text x="640" y="339" text-anchor="middle" font-size="9" fill="#6b7280">پس از لغو سفارش</text>

  <line x1="170" y1="328" x2="208" y2="328" stroke="#ca8a04" stroke-width="2" marker-end="url(#as)"/>
  <line x1="350" y1="318" x2="388" y2="318" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="350" y1="338" x2="568" y2="338" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ac)"/>

  <defs>
    <marker id="as" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ca8a04"/></marker>
    <marker id="ac" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/></marker>
  </defs>
</svg>
